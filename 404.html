<title>Contraband has moved</title>
<meta name="robots" content="noindex">
<script>
  // Preserve whatever sub-path/query/hash was requested and forward it to the
  // new home, so deep links like /contraband/thegiver/ keep working.
  (function () {
    var NEW = "https://mguhlin.github.io/contraband/";
    var sub = location.pathname.replace(/^\/contraband\/?/, "");
    location.replace(NEW + sub + location.search + location.hash);
  })();
</script>
